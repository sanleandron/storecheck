# ============================================================
# StoreCheck HD — Deploy a GitHub Pages (mediante GitHub Actions)
# URL resultante: https://<usuario>.github.io/storecheck/
# ============================================================
# Antes del primer deploy (una sola vez, en el repo):
#   1. Repo -> Settings -> Secrets and variables -> Actions -> New repository secret:
#        - VITE_SUPABASE_URL  = https://<tu-ref>.supabase.co
#        - VITE_SUPABASE_ANON_KEY = <tu-anon-key>
#   2. Repo -> Settings -> Pages -> Source: "GitHub Actions"
# ============================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Da permiso para publicar Pages y el artefacto
permissions:
  contents: read
  pages: write
  id-token: write

# Solo un deploy a la vez
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build (con variables de Supabase desde Secrets)
        env:
          BASE_URL: /storecheck/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4